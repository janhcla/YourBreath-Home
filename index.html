<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YourBreath — Calm breathing for iPhone and Apple Watch</title>
    <meta name="description" content="YourBreath helps you start a calm breathing session on iPhone or Apple Watch. No account, no ads, no analytics — your sessions stay with you." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://yourbreath.pages.dev/" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
                950: '#082f49',
              },
              dark: {
                bg: '#0f172a',
                card: '#1e293b',
                surface: '#334155'
              }
            },
            animation: {
              'breathe': 'breathe 8s infinite ease-in-out',
              'float': 'float 6s ease-in-out infinite',
              'box': 'box 8s infinite linear',
              'coherent': 'coherent 6s infinite ease-in-out',
              'cyclic': 'cyclic 6s infinite ease-out',
              'text-breathe-inhale': 'text-breathe-inhale 8s infinite ease-in-out',
              'text-breathe-exhale': 'text-breathe-exhale 8s infinite ease-in-out',
              'text-box-inhale': 'text-box-inhale 8s infinite linear',
              'text-box-hold1': 'text-box-hold1 8s infinite linear',
              'text-box-exhale': 'text-box-exhale 8s infinite linear',
              'text-box-hold2': 'text-box-hold2 8s infinite linear',
              'text-coherent-inhale': 'text-coherent-inhale 6s infinite ease-in-out',
              'text-coherent-exhale': 'text-coherent-exhale 6s infinite ease-in-out',
              'text-cyclic-inhale': 'text-cyclic-inhale 6s infinite ease-out',
              'text-cyclic-exhale': 'text-cyclic-exhale 6s infinite ease-out',
            },
            keyframes: {
              breathe: { '0%, 100%': { transform: 'scale(1)', opacity: '0.8' }, '50%': { transform: 'scale(1.5)', opacity: '0.4' } },
              float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-20px)' } },
              box: { '0%': { transform: 'scale(1)' }, '25%': { transform: 'scale(1.5)' }, '50%': { transform: 'scale(1.5)' }, '75%': { transform: 'scale(1)' }, '100%': { transform: 'scale(1)' } },
              coherent: { '0%, 100%': { transform: 'scale(1)', opacity: '0.85' }, '50%': { transform: 'scale(1.5)', opacity: '0.5' } },
              cyclic: { '0%': { transform: 'scale(1)' }, '40%': { transform: 'scale(1.3)' }, '55%': { transform: 'scale(1.5)' }, '100%': { transform: 'scale(1)' } },
              'text-breathe-inhale': { '0%, 49.9%': { opacity: '1' }, '50%, 100%': { opacity: '0' } },
              'text-breathe-exhale': { '0%, 49.9%': { opacity: '0' }, '50%, 100%': { opacity: '1' } },
              'text-box-inhale': { '0%, 24.9%': { opacity: '1' }, '25%, 100%': { opacity: '0' } },
              'text-box-hold1': { '0%, 24.9%': { opacity: '0' }, '25%, 49.9%': { opacity: '1' }, '50%, 100%': { opacity: '0' } },
              'text-box-exhale': { '0%, 49.9%': { opacity: '0' }, '50%, 74.9%': { opacity: '1' }, '75%, 100%': { opacity: '0' } },
              'text-box-hold2': { '0%, 74.9%': { opacity: '0' }, '75%, 100%': { opacity: '1' } },
              'text-coherent-inhale': { '0%, 49.9%': { opacity: '1' }, '50%, 100%': { opacity: '0' } },
              'text-coherent-exhale': { '0%, 49.9%': { opacity: '0' }, '50%, 100%': { opacity: '1' } },
              'text-cyclic-inhale': { '0%, 54.9%': { opacity: '1' }, '55%, 100%': { opacity: '0' } },
              'text-cyclic-exhale': { '0%, 54.9%': { opacity: '0' }, '55%, 100%': { opacity: '1' } }
            }
          },
        },
      }
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourbreath.pages.dev/" />
    <meta property="og:title" content="YourBreath — Calm breathing for iPhone and Apple Watch" />
    <meta property="og:description" content="Start a calm breath on iPhone or Apple Watch before the day gets loud. No account. No ads. No analytics." />
    <meta property="og:image" content="https://yourbreath.pages.dev/og-image.svg" />
    <meta property="og:site_name" content="YourBreath" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YourBreath — Calm breathing for iPhone and Apple Watch" />
    <meta name="twitter:description" content="Start a calm breath on iPhone or Apple Watch before the day gets loud. No account. No ads. No analytics." />
    <meta name="twitter:image" content="https://yourbreath.pages.dev/og-image.svg" />

    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://developer.apple.com" />
    <style>
      body { background-color: #0f172a; color: #f8fafc; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "YourBreath",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "iOS, watchOS",
        "description": "YourBreath helps you start calm breathing sessions on iPhone and Apple Watch without accounts, ads, or analytics.",
        "url": "https://yourbreath.pages.dev/",
        "image": "https://yourbreath.pages.dev/og-image.svg",
        "author": { "@type": "Person", "name": "Jan H. Clausen" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
